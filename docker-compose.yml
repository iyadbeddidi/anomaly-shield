services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    environment:
      - ANOMALY_THRESHOLD=0.5
      - ALERT_LOG_FILE=/app/logs/alerts.log

  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
    environment:
      - ANOMALY_THRESHOLD=0.5
      - ALERT_LOG_FILE=/app/logs/alerts.log
